# Кэш изображений (производные данные: при потере кэш просто наполнится заново).
# Имена файлов содержат UUID и не меняются, поэтому кэшировать их безопасно.
proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:10m max_size=1g inactive=7d use_temp_path=off;

server {
    listen 80;
    client_max_body_size 10M;

    location = /api/docs/ {
        alias /usr/share/nginx/docs/redoc.html;
    }

    location /api/docs/ {
        alias /usr/share/nginx/docs/;
    }

    # Изображения хранятся в S3-хранилище; их отдаёт бэкенд, nginx кэширует ответы
    location /media/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache media;
        proxy_cache_valid 200 7d;
        proxy_cache_key $uri;
        proxy_pass http://backend:8000;
    }

    location /s/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://backend:8000;
    }

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://backend:8000;
    }

    location / {
        root /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri /index.html;
    }
}
