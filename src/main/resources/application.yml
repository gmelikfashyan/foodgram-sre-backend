server:
  port: 8000
  forward-headers-strategy: framework
  shutdown: graceful


spring:
  application:
    name: foodgram
  main:
    banner-mode: off
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/foodgram_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    enabled: false
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: always
  lifecycle:
    timeout-per-shutdown-phase: 30s

logging:
  structured:
    format:
      console: com.foodgram.logging.JsonLogFormatter
  level:
    root: ${LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
  media-url: /media/
  hashids-salt: ${HASHIDS_SALT:Testing_salt}
  page-size: 6
  max-page-size: 100
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:foodgram-media}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    path-style: ${S3_PATH_STYLE:true}
    create-bucket: ${S3_CREATE_BUCKET:true}
