services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: foodgram_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d foodgram_db"]
      interval: 5s
      retries: 10
  flyway:
    image: flyway/flyway:10-alpine
    command: migrate
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/foodgram_db
      FLYWAY_USER: ${DB_USERNAME}
      FLYWAY_PASSWORD: ${DB_PASSWORD}
      FLYWAY_BASELINE_ON_MIGRATE: "true"
    depends_on:
      db:
        condition: service_healthy

  storage:
    container_name: com.foodgram-storage
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - storage_data:/data
    restart: unless-stopped


  backend:
    image: foodgram-backend:${IMAGE_TAG}
    ports:
      - "8000:8000"
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_started
      storage:
        condition: service_started
      flyway:
        condition: service_completed_successfully

  frontend:
    container_name: foodgram-frontend
    image: foodgram-frontend:${FRONTEND_IMAGE_TAG}
    volumes:
      - frontend_build:/app/result_build/
    restart: "no"

  gateway:
    container_name: foodgram-proxy
    image: foodgram-gateway:${IMAGE_TAG}
    ports:
      - "80:80"
    volumes:
      - frontend_build:/usr/share/nginx/html/:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully
    restart: always

volumes:
  postgres: {}
  storage_data: {}
  frontend_build: {}